# Weekly, GROUPED dependency update PRs so bumps arrive as one PR, not a flood.
# Security updates are separate and arrive immediately once enabled in settings.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      gradle-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions-deps:
        patterns: ["*"]
