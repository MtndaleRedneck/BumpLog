name: Build

on:
  push:
    branches: [main, redesign-modernization-1124]
    paths-ignore: ['docs/screenshots/**']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub release (only after review sign-off)
        type: boolean
        default: false

# A newer push cancels a stale run of the same ref - otherwise two runs can race their
# screenshots commits and the loser dies on a binary rebase conflict. Manual publish runs
# get their own group so a push never cancels a publish.
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Write access: this job can push an unpacked source bundle and publishes the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # A source.tgz in the repo root is a bundle of changes: unpack it, commit it, then build.
      # Main-context only: this step pushes to main, so it must never run on a review-branch trigger.
      - name: Unpack source bundle
        if: github.ref_name == 'main'
        run: |
          F=$(ls ./*source.tgz 2>/dev/null | head -1)
          if [ -n "$F" ]; then
            # Hygiene: refuse absolute paths, .. entries and links before unpacking, and never
            # take ownership from the archive. Only someone who can push to main can land a
            # bundle; this keeps a malformed one from writing outside the tree.
            if tar -tzf "$F" | grep -qE '^/|(^|/)\.\.(/|$)'; then echo "Unsafe paths in source bundle"; exit 1; fi
            if tar -tzvf "$F" | grep -qE '^[lh]'; then echo "Links in source bundle"; exit 1; fi
            tar --no-same-owner -xzf "$F"
            rm "$F"
            git config user.name "MtndaleRedneck"
            git config user.email "117659952+MtndaleRedneck@users.noreply.github.com"
            git add -A
            git commit -m "Unpack source bundle" || true
            git push origin HEAD:main
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
      - name: Install Android 37 platform and build-tools
        run: |
          # sdkmanager install is idempotent: run it unconditionally so a present platform can
          # never mask a missing build-tools package.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" >/dev/null

      # Robolectric downloads its android-all runtime to ~/.m2 outside Gradle's cache; keep
      # it across runs, and retry the test task once - Maven Central 429s are a known flake.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('**/build.gradle.kts') }}

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest || ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: bumplog
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No signing secrets set"; exit 1; fi
          trap 'rm -f "$RUNNER_TEMP/release.keystore"' EXIT
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          ./gradlew --no-daemon assembleRelease assembleDebug
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Name the APK
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$V" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk BumpLog-v$V.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BumpLog-apk
          path: BumpLog-v*.apk

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v$VERSION
          # Releases are published only for a new version number. An existing release is never replaced.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump versionName to publish a new release."
            exit 0
          fi
          # Release pages show ONLY their own version's notes (owner's standing rule, Oct 2026):
          # extract the "BumpLog $V" section from the running notes file.
          awk -v v="BumpLog $VERSION" 'BEGIN{f=0} $0 ~ /^BumpLog / { if($0==v){f=1}else if(f){exit} } f' release-notes.md > /tmp/notes.md
          if [ -s /tmp/notes.md ]; then
            gh release create "$TAG" "BumpLog-v$VERSION.apk" \
              --target "$(git rev-parse HEAD)" \
              --title "BumpLog $TAG" \
              --notes-file /tmp/notes.md
          else
            gh release create "$TAG" "BumpLog-v$VERSION.apk" \
              --target "$(git rev-parse HEAD)" \
              --title "BumpLog $TAG" \
              --notes "BumpLog $TAG. See the README for setup."
          fi

  # The v6 -> v7 upgrade path runs on a real emulator: the continuity proof must
  # actually open a versioned database, not just compile.
  db-upgrade-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
      - name: Install Android 37 platform and build-tools
        run: |
          # sdkmanager install is idempotent: run it unconditionally so a present platform can
          # never mask a missing build-tools package.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" >/dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bumplog-androidTest-results
          path: app/build/reports/androidTests/**

  # The release proof the debug jobs cannot give: the signed, minified, resource-shrunk APK
  # installed and exercised on a real emulator.
  release-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
      - name: Install Android 37 platform and build-tools
        run: |
          # sdkmanager install is idempotent: run it unconditionally so a present platform can
          # never mask a missing build-tools package.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" >/dev/null
      - name: Build signed release APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: bumplog
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No signing secrets set"; exit 1; fi
          trap 'rm -f "$RUNNER_TEMP/release.keystore"' EXIT
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/release.keystore"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: ./scripts/release-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bumplog-release-smoke
          path: release-smoke/**

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    # Write access: this job commits the new screenshots.
    permissions:
      contents: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
      - name: Install Android 37 platform and build-tools
        run: |
          # sdkmanager install is idempotent: run it unconditionally so a present platform can
          # never mask a missing build-tools package.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" >/dev/null
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: ./scripts/shots.sh
      # Pixel evidence survives a failed run: the captures upload even when an assertion fails,
      # so a red job still shows exactly what was on screen.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bumplog-screenshots-run
          path: docs/screenshots/**
      - name: Commit screenshots
        env:
          # Never interpolate github.ref_name into shell: pass it through the environment and quote it.
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "MtndaleRedneck"
          git config user.email "117659952+MtndaleRedneck@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Add app screenshots from emulator" || exit 0
          git pull --rebase origin "$REF_NAME"
          git push origin "HEAD:$REF_NAME"
