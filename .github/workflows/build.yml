name: Build

on:
  push:
    branches: [main, redesign-modernization-1124, ui-1.19.0, ui-1.20.0]
    paths-ignore: ['docs/screenshots/**']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub release (only after review sign-off)
        type: boolean
        default: false

# A newer push cancels a stale run of the same ref - otherwise two runs can race their
# screenshots commits and the loser dies on a binary rebase conflict. Manual publish runs
# get their own group so a push never cancels a publish.
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Write access: this job can push an unpacked source bundle and publishes the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # A source.tgz in the repo root is a bundle of changes: unpack it, commit it, then build.
      # Main-context only: this step pushes to main, so it must never run on a review-branch trigger.
      - name: Unpack source bundle
        if: github.ref == 'refs/heads/main'
        run: |
          F=$(ls ./*source.tgz 2>/dev/null | head -1)
          if [ -n "$F" ]; then
            # Hygiene: refuse absolute paths, .. entries and links before unpacking, and never
            # take ownership from the archive. Only someone who can push to main can land a
            # bundle; this keeps a malformed one from writing outside the tree.
            if tar -tzf "$F" | grep -qE '^/|(^|/)\.\.(/|$)'; then echo "Unsafe paths in source bundle"; exit 1; fi
            if tar -tzvf "$F" | grep -qE '^[lh]'; then echo "Links in source bundle"; exit 1; fi
            tar --no-same-owner -xzf "$F"
            rm "$F"
            git config user.name "MtndaleRedneck"
            git config user.email "117659952+MtndaleRedneck@users.noreply.github.com"
            git add -A
            git commit -m "Unpack source bundle" || true
            git push origin HEAD:main
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
      - name: Install Android 37 platform and build-tools
        run: |
          # sdkmanager install is idempotent: run it unconditionally so a present platform can
          # never mask a missing build-tools package.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" >/dev/null

      # Robolectric downloads its android-all runtime to ~/.m2 outside Gradle's cache; keep
      # it across runs, and retry the test task once - Maven Central 429s are a known flake.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('**/build.gradle.kts') }}

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest || ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: bumplog
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No signing secrets set"; exit 1; fi
          trap 'rm -f "$RUNNER_TEMP/release.keystore"' EXIT
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          ./gradlew --no-daemon assembleRelease assembleDebug
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Name the APK
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$V" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk BumpLog-v$V.apk
          # Provenance: bind the exact bytes and the exact built commit (a source-bundle unpack
          # can move HEAD past github.sha before building) so downstream jobs tag and install
          # what was actually built, never a same-named rebuild.
          sha256sum BumpLog-v$V.apk | awk '{print $1}' > BumpLog-v$V.apk.sha256
          git rev-parse HEAD > built-commit.txt

      - name: Verify release signer
        run: |
          # Fail-closed, pre-publish: the release APK must carry the same signer as the live
          # install. Pin grounded byte-direct in the live v1.17.2 APK's v2 signing block
          # (public data, present in every shipped APK). KEY ROTATION: if the signing key
          # ever changes, this pin must change in the same commit or every build fails here.
          # The publish job digest-binds the exact artifact verified here, so this gate
          # covers the published bytes. VERSION comes from GITHUB_ENV (Name the APK step).
          EXPECTED=c88752c76cb398fa88f18b6bf39420f01d008169542fcd50ba6ef5355fce2ed0
          if ! OUT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "BumpLog-v$VERSION.apk" 2>&1); then
            echo "FAIL: apksigner verify exited nonzero:"
            echo "$OUT"
            exit 1
          fi
          ACTUAL=$(printf '%s\n' "$OUT" | grep -m1 "Signer #1 certificate SHA-256 digest:" | awk '{print $NF}')
          if [ -z "$ACTUAL" ]; then echo "FAIL: apksigner printed no Signer #1 SHA-256 digest"; exit 1; fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then echo "FAIL: signer $ACTUAL != expected $EXPECTED"; exit 1; fi
          echo "signer verified: $ACTUAL"

      - uses: actions/upload-artifact@v4
        with:
          name: BumpLog-apk
          path: |
            BumpLog-v*.apk
            BumpLog-v*.apk.sha256
            built-commit.txt

  # The v6 -> v7 upgrade path runs on a real emulator: the continuity proof must
  # actually open a versioned database, not just compile.
  db-upgrade-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
      - name: Install Android 37 platform and build-tools
        run: |
          # sdkmanager install is idempotent: run it unconditionally so a present platform can
          # never mask a missing build-tools package.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" >/dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bumplog-androidTest-results
          path: app/build/reports/androidTests/**

  # The release proof the debug jobs cannot give: the signed, minified, resource-shrunk APK
  # installed and exercised on a real emulator.
  release-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
      - name: Install Android 37 platform and build-tools
        run: |
          # sdkmanager install is idempotent: run it unconditionally so a present platform can
          # never mask a missing build-tools package.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" >/dev/null
      - uses: actions/download-artifact@v4
        with:
          name: BumpLog-apk
      - name: Bind the exact build-job APK by digest
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          WANT=$(cat BumpLog-v$V.apk.sha256); GOT=$(sha256sum BumpLog-v$V.apk | awk '{print $1}')
          if [ "$WANT" != "$GOT" ]; then echo "FAIL: APK digest mismatch ($GOT != $WANT)"; exit 1; fi
          mkdir -p app/build/outputs/apk/release
          cp BumpLog-v$V.apk app/build/outputs/apk/release/app-release.apk
          echo "release-smoke installs the exact build-job APK (sha256 $GOT)"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: ./scripts/release-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bumplog-release-smoke
          path: release-smoke/**

  upgrade-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: BumpLog-apk
      - name: Stage APKs
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p app/build/outputs/apk/release old
          cp BumpLog-v$V.apk app/build/outputs/apk/release/app-release.apk
          curl -sfL -o old/BumpLog-v1.19.0.apk https://github.com/MtndaleRedneck/BumpLog/releases/download/v1.19.0/BumpLog-v1.19.0.apk
          ls -la old app/build/outputs/apk/release
      - name: Bind artifact and signer
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          WANT=$(cat BumpLog-v$V.apk.sha256); GOT=$(sha256sum app/build/outputs/apk/release/app-release.apk | awk '{print $1}')
          if [ "$WANT" != "$GOT" ]; then echo "FAIL: candidate digest $GOT != build digest $WANT"; exit 1; fi
          echo "candidate versionName $V sha256 $GOT (build-job digest, built commit $(cat built-commit.txt))"
          AS="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          OLDS=$("$AS" verify --print-certs old/BumpLog-v1.19.0.apk | grep -m1 "Signer #1 certificate SHA-256 digest:" | awk '{print $NF}')
          NEWS=$("$AS" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -m1 "Signer #1 certificate SHA-256 digest:" | awk '{print $NF}')
          echo "public v1.19.0 signer $OLDS; candidate signer $NEWS; old apk sha256 $(sha256sum old/BumpLog-v1.19.0.apk | awk '{print $1}')"
          if [ -z "$OLDS" ] || [ "$OLDS" != "$NEWS" ]; then echo "FAIL: signer mismatch"; exit 1; fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: ./scripts/upgrade-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bumplog-upgrade-smoke
          path: upgrade-smoke/**

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    # Write access: this job commits the new screenshots.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0  # the commit step rebases onto the branch tip; shallow would fail
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
      - name: Install Android 37 platform and build-tools
        run: |
          # sdkmanager install is idempotent: run it unconditionally so a present platform can
          # never mask a missing build-tools package.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" >/dev/null
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: ./scripts/shots.sh
      # Pixel evidence survives a failed run: the captures upload even when an assertion fails,
      # so a red job still shows exactly what was on screen.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bumplog-screenshots-run
          path: docs/screenshots/**
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bumplog-tab-recording
          path: tabsrec/**
      - name: Commit screenshots
        env:
          # Never interpolate github.ref_name into shell: pass it through the environment and quote it.
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "MtndaleRedneck"
          git config user.email "117659952+MtndaleRedneck@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Add app screenshots from emulator" || exit 0
          git pull --rebase origin "$REF_NAME"
          git push origin "HEAD:$REF_NAME"

  # Publish is its own job so a release can only go out AFTER the same commit's build,
  # db-upgrade, release-smoke and screenshots jobs are ALL green - never from inside the
  # build job while its tests are still running. Publish runs from main only: the reviewed
  # branch is fast-forwarded first, then the publish dispatch targets that exact commit.
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [build, db-upgrade-test, release-smoke, upgrade-smoke, screenshots]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: BumpLog-apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          printf '%s' "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "FAIL: versionName malformed ('$V')"; exit 1; }
          TAG=v$V
          # Bind what we publish to what was built and smoke-verified: exact bytes by digest,
          # and the exact commit. The other jobs check out and test github.sha, so a build job
          # whose tree moved (source-bundle unpack) produced an UNTESTED-as-published artifact:
          # refuse to publish it here; publish only the exact tested commit.
          WANT=$(cat BumpLog-v$V.apk.sha256); GOT=$(sha256sum BumpLog-v$V.apk | awk '{print $1}')
          printf '%s' "$WANT" | grep -qE '^[0-9a-f]{64}$' || { echo "FAIL: malformed digest in provenance ('$WANT')"; exit 1; }
          if [ "$WANT" != "$GOT" ]; then echo "FAIL: APK digest mismatch ($GOT != $WANT)"; exit 1; fi
          BUILT=$(cat built-commit.txt)
          printf '%s' "$BUILT" | grep -qE '^[0-9a-f]{40}$' || { echo "FAIL: built-commit.txt malformed ('$BUILT')"; exit 1; }
          if [ "$BUILT" != "$GITHUB_SHA" ]; then
            echo "FAIL: built commit $BUILT != dispatched commit $GITHUB_SHA (build tree moved, e.g. source-bundle unpack). This artifact was not the tested tree; refusing to publish."
            exit 1
          fi
          # Releases are published only for a new version number, and the check fails CLOSED:
          # only a real HTTP 404 means absent. 200 means it exists; any other status
          # (401/403/5xx) or no status line at all (network/proxy failure) refuses the publish.
          REF_ST=$(gh api -i "repos/{owner}/{repo}/git/ref/tags/$TAG" 2>&1 | sed -n 's/^HTTP[^ ]* \([0-9][0-9][0-9]\).*/\1/p' | head -1)
          REL_ST=$(gh api -i "repos/{owner}/{repo}/releases/tags/$TAG" 2>&1 | sed -n 's/^HTTP[^ ]* \([0-9][0-9][0-9]\).*/\1/p' | head -1)
          if [ "$REF_ST" = "200" ]; then
            echo "FAIL: tag $TAG already exists (HTTP 200). Resolve the tag before publishing."
            exit 1
          fi
          if [ "$REL_ST" = "200" ]; then
            echo "FAIL: release $TAG already exists (HTTP 200). Bump versionName to publish a new release."
            exit 1
          fi
          if [ "$REF_ST" != "404" ]; then
            echo "FAIL: could not verify tag $TAG is absent (status '${REF_ST:-none}'); refusing to publish."
            exit 1
          fi
          if [ "$REL_ST" != "404" ]; then
            echo "FAIL: could not verify release $TAG is absent (status '${REL_ST:-none}'); refusing to publish."
            exit 1
          fi
          echo "GUARD-PASSED: no tag or release named $TAG (both HTTP 404)."
          # Release pages show ONLY their own version's notes: extract the "BumpLog $V"
          # section from the notes file. A missing section FAILS CLOSED - no generic fallback.
          awk -v v="BumpLog $V" 'BEGIN{f=0} $0 ~ /^BumpLog / { if($0==v){f=1}else if(f){exit} } f' release-notes.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "FAIL: release-notes.md has no 'BumpLog $V' section; refusing to publish with fallback notes."
            exit 1
          fi
          # Fail-closed BEFORE anything is published: create the tag explicitly at the exact
          # tested commit. gh release create reuses an existing tag as-is, so the only tag it
          # can publish under is a verified one. (Draft-then-publish is not usable: GitHub
          # creates the tag only when a draft publishes, leaving nothing to check beforehand.)
          # A failed create deletes NOTHING - a tag another actor created is never ours to remove.
          if ! gh api -X POST "repos/{owner}/{repo}/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /tmp/tag-create.json; then
            echo "FAIL: could not create tag $TAG (race or API error); refusing to publish; no existing tag touched"
            exit 1
          fi
          # Independent read right before the commit point: the POST response only echoes the
          # sha we sent, so it proves nothing. This GET bounds but cannot eliminate the
          # replace-window before gh release create; the post-release read below is the backstop.
          # On mismatch we do NOT delete: in the window since our create another actor may own
          # the tag now, and the refs API has no compare-and-delete. Fail and leave it for a human.
          ACTUAL=$(gh api "repos/{owner}/{repo}/git/ref/tags/$TAG" --jq '.object.sha') || { echo "FAIL: could not re-read tag $TAG after creating it"; exit 1; }
          if [ "$ACTUAL" != "$GITHUB_SHA" ]; then
            echo "FAIL: tag $TAG peels to $ACTUAL, expected $GITHUB_SHA; NOT deleting (ownership unprovable); refusing to publish; human review required"
            exit 1
          fi
          echo "tag verified immediately before release: $TAG -> $GITHUB_SHA"
          gh release create "$TAG" "BumpLog-v$V.apk" \
            --target "$GITHUB_SHA" \
            --title "BumpLog $TAG" \
            --notes-file /tmp/notes.md
          # Post-release backstop: the release is live now, so this is detection, not
          # prevention. The asserted value is the tag peel, an independent read of the actual
          # ref. target_commitish is DIAGNOSTIC ONLY: GitHub documents it as "Unused if the
          # Git tag already exists" (our tag always exists, created above) and API responses
          # can carry a branch name instead of the sent sha, so it must never gate a live release.
          REL_TARGET=$(gh api "repos/{owner}/{repo}/releases/tags/$TAG" --jq '.target_commitish') || REL_TARGET=''
          echo "diagnostic: release target_commitish='${REL_TARGET:-unreadable}'"
          FINAL_SHA=$(gh api "repos/{owner}/{repo}/git/ref/tags/$TAG" --jq '.object.sha') || FINAL_SHA=''
          if [ "$FINAL_SHA" != "$GITHUB_SHA" ]; then
            echo "FAIL: post-publish tag peel '${FINAL_SHA:-unreadable}' != tested commit $GITHUB_SHA (mismatch or unreadable ref). The release is LIVE; human review and cleanup required."
            exit 1
          fi
          echo "verified after publish: tag $TAG peels to $GITHUB_SHA"
