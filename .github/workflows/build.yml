name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/screenshots/**']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub release (only after review sign-off)
        type: boolean
        default: false

# A newer push cancels a stale run of the same ref - otherwise two runs can race their
# screenshots commits and the loser dies on a binary rebase conflict. Manual publish runs
# get their own group so a push never cancels a publish.
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Write access: this job can push an unpacked source bundle and publishes the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # A source.tgz in the repo root is a bundle of changes: unpack it, commit it, then build.
      - name: Unpack source bundle
        run: |
          F=$(ls ./*source.tgz 2>/dev/null | head -1)
          if [ -n "$F" ]; then
            tar xzf "$F"
            rm "$F"
            git config user.name "MtndaleRedneck"
            git config user.email "117659952+MtndaleRedneck@users.noreply.github.com"
            git add -A
            git commit -m "Unpack source bundle" || true
            git push origin HEAD:main
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: bumplog
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No signing secrets set"; exit 1; fi
          trap 'rm -f "$RUNNER_TEMP/release.keystore"' EXIT
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          ./gradlew --no-daemon assembleRelease assembleDebug
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Name the APK
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$V" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk BumpLog-v$V.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BumpLog-apk
          path: BumpLog-v*.apk

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v$VERSION
          # Releases are published only for a new version number. An existing release is never replaced.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump versionName to publish a new release."
            exit 0
          fi
          # Release pages show ONLY their own version's notes (owner's standing rule, Oct 2026):
          # extract the "BumpLog $V" section from the running notes file.
          awk -v v="BumpLog $VERSION" 'BEGIN{f=0} $0 ~ /^BumpLog / { if($0==v){f=1}else if(f){exit} } f' release-notes.md > /tmp/notes.md
          if [ -s /tmp/notes.md ]; then
            gh release create "$TAG" "BumpLog-v$VERSION.apk" \
              --target "$(git rev-parse HEAD)" \
              --title "BumpLog $TAG" \
              --notes-file /tmp/notes.md
          else
            gh release create "$TAG" "BumpLog-v$VERSION.apk" \
              --target "$(git rev-parse HEAD)" \
              --title "BumpLog $TAG" \
              --notes "BumpLog $TAG. See the README for setup."
          fi

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    # Write access: this job commits the new screenshots.
    permissions:
      contents: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: ./scripts/shots.sh
      - name: Commit screenshots
        run: |
          git config user.name "MtndaleRedneck"
          git config user.email "117659952+MtndaleRedneck@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Add app screenshots from emulator" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
