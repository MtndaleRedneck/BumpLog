# Phase-2 static analysis: Android Lint + detekt, report-only.
# Findings upload to GitHub code scanning (Security tab); the job NEVER fails
# on findings. No product/build files are touched: lint SARIF output is injected
# by an init script; detekt runs as the official standalone CLI (no Gradle
# plugin application, no build-file changes).
# detekt CLI pinned: v1.23.8 -all.jar from the official GitHub release,
# sha256 measured on download 2026-11-23 (detekt publishes no checksums).
# Exit handling (instinct1 patch, contract VERIFIED 2026-11-23 against the exact
# pinned jar with controlled clean/findings/invalid-config/missing-input runs):
#   detekt CLI 1.23.8: 0 = no findings, 2 = findings present, 1 = config/usage
#   error (no SARIF written). Accept ONLY 0 and 2; anything else fails red.
#   Outputs are deleted before each run and a fresh, non-empty, parseable SARIF
#   is required afterwards, so no stale artifact can masquerade as a result.
#   lint: abortOnError=false (init script) keeps findings non-failing, so a
#   nonzero gradle exit means a genuine scan/build error and fails red.
#   upload-sarif does not continue on error: a failed upload is visible.
name: Static Analysis (lint/detekt)

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'   # weekly, Monday 05:17 UTC

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: false   # never cancel builders' runs; wait our turn

jobs:
  lint:
    name: Android Lint (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      security-events: write   # SARIF upload
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
      - name: Run Android Lint (report-only)
        run: ./gradlew -I .github/analysis/lint-sarif.init.gradle lint --continue
      - name: Collect lint reports
        if: always()
        run: |
          mkdir -p /tmp/sarif-lint /tmp/html-lint
          find . -path '*/build/reports/lint-results*.sarif' -exec cp --backup=numbered {} /tmp/sarif-lint/ \;
          find . -path '*/build/reports/lint-results*.html' -exec cp --backup=numbered {} /tmp/html-lint/ \;
          ls -la /tmp/sarif-lint/
          if ! ls /tmp/sarif-lint/*.sarif >/dev/null 2>&1; then
            echo "ERROR: lint produced no SARIF report - the scan did not complete; refusing to report green."
            exit 1
          fi
      - name: Upload lint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: /tmp/sarif-lint
          category: android-lint
          wait-for-processing: false
      - name: Upload lint HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-report
          path: /tmp/html-lint/
          if-no-files-found: ignore

  detekt:
    name: detekt (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Download pinned detekt CLI
        run: |
          curl -sSfL -o /tmp/detekt-cli.jar \
            https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8-all.jar
          echo "2ce2ff952e150baf28a29cda70a363b0340b3e81a55f43e51ec5edffc3d066c1  /tmp/detekt-cli.jar" | sha256sum -c -
      - name: Run detekt (report-only)
        run: |
          rm -f /tmp/detekt.sarif /tmp/detekt.html
          set +e
          java -jar /tmp/detekt-cli.jar \
            --input . \
            --config .github/analysis/detekt-config.yml \
            --build-upon-default-config \
            --parallel \
            --excludes "**/build/**,**/res/**,**/.git/**" \
            --report sarif:/tmp/detekt.sarif \
            --report html:/tmp/detekt.html
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "ERROR: detekt exited $rc (verified contract: 0=clean, 2=findings, 1=error); refusing to report green."
            exit "$rc"
          fi
          if [ ! -s /tmp/detekt.sarif ]; then
            echo "ERROR: detekt produced no fresh non-empty SARIF; refusing to report green."
            exit 1
          fi
          count=$(python3 -c "import json,sys; d=json.load(open('/tmp/detekt.sarif')); print(sum(len(r.get('results',[])) for r in d['runs']))")
          echo "detekt completed report-only (exit $rc, $count SARIF results)"
          ls -la /tmp/detekt.sarif /tmp/detekt.html
      - name: Upload detekt SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: /tmp/detekt.sarif
          category: detekt
          wait-for-processing: false
      - name: Upload detekt HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: detekt-report
          path: /tmp/detekt.html
          if-no-files-found: ignore
