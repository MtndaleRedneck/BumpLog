name: status-icon-spacing
# Measurement only. Installs RELEASED APKs, builds nothing, changes no app code.
# Run on a public repo (free standard runner), workflow_dispatch only.
on:
  push:
    branches: [diag-status-icon-spacing]   # one-time start: a workflow file off the default branch cannot be dispatched by API
  workflow_dispatch:
    inputs:
      api: { description: 'Android API level', default: '34' }
      dpi: { description: 'Density (480 = user phone per BumpLog feedback report)', default: '480' }
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow numpy
      - name: Download released APKs (public release assets only)
        run: |
          mkdir -p apks out
          curl -fsSL -o apks/BumpLog.apk     https://github.com/MtndaleRedneck/BumpLog/releases/download/v1.20.0/BumpLog-v1.20.0.apk
          # BingeMote and HomeRoom: downloaded for identity/asset record only; no offline notification trigger exists (see README).
          curl -fsSL -o apks/BingeMote.apk   https://github.com/MtndaleRedneck/BingeMote/releases/download/android-v1.15.2/BingeMote-Android-1.15.2.apk
          curl -fsSL -o apks/HomeRoom.apk    https://github.com/MtndaleRedneck/HomeRoom/releases/download/v1.7/HomeRoom-1.7.apk
          curl -fsSL -o apks/ListenLater.apk https://github.com/MtndaleRedneck/Listen-Later/releases/download/v1.12.0/ListenLater-v1.12.0.apk
          ls -l apks
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api || '34' }}
          target: google_apis   # userdebug image: `adb root` works, so the protected BOOT_COMPLETED shell broadcast is allowed
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: API=${{ inputs.api || '34' }} DPI=${{ inputs.dpi || '480' }} bash scripts-diag/emu_run.sh
      - name: Identity (sha256, versions, package, targetSdk, ic_stat in released APKs)
        if: always()
        run: python scripts-diag/apk_identity.py apks > out/apk_identity.txt; cat out/apk_identity.txt
      - name: Measure
        if: always()
        run: python scripts-diag/measure.py out > out/measurements.txt; cat out/measurements.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: status-icon-spacing-api${{ inputs.api || '34' }}-${{ inputs.dpi || '480' }}dpi
          path: |
            out/*.png
            out/*.json
            out/*.txt
            out/*.xml
            scripts-diag/*
