# CodeQL security scan - Android/Kotlin variant.
# Kotlin has NO buildless mode: init must use build-mode manual + a real Gradle build.
# Triggers on PRs to main + weekly schedule only; pushing this file does not run it.
name: CodeQL

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * 2'   # weekly, Tuesday 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload results to the Security tab
      contents: read
      actions: read            # read workflow run metadata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 (SHA-verified 2026-11-23)

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v4.9.1 (SHA-verified 2026-11-23)
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: github/codeql-action/init@v4   # v4 = current major per repo README
        with:
          languages: java-kotlin
          build-mode: manual

      # Daemon and build cache make CodeQL miss classes or hang; keep them off.
      # Debug variant only: no signing secrets needed, safe on PRs.
      - name: Build for CodeQL
        run: ./gradlew --no-daemon --no-build-cache assembleDebug

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
