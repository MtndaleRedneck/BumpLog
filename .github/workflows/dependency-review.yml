# Fails a PR when it introduces dependencies with known vulnerabilities.
# Free for public repos; needs the dependency graph (default-on for public repos).
name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (SHA-verified 2026-11-23)
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1 (SHA-verified 2026-11-23)
        with:
          fail-on-severity: high
